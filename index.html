<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dart Pro - Full Center</title>
    <style>
        :root {
            --bg: #121212;
            --accent: #f1c40f;
            --red: #e74c3c;
            --green: #27ae60;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            /* Centralne pozycjonowanie w Flexbox */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        #ui-top {
            text-align: center;
            margin-bottom: 20px;
            pointer-events: none;
            z-index: 10;
        }

        #score {
            font-size: 4rem;
            font-weight: 800;
            color: var(--accent);
            margin: 0;
            line-height: 1;
            text-shadow: 0 0 20px rgba(241, 196, 15, 0.3);
        }

        #info {
            font-size: 1.2rem;
            color: #aaa;
            margin-top: 5px;
            height: 1.5em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #container {
            width: 90vw;
            height: 90vw;
            max-width: 500px;
            max-height: 500px;
            position: relative;
            touch-action: none;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border-radius: 50%;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .marker {
            fill: #fff;
            stroke: #000;
            stroke-width: 1;
            pointer-events: none;
            animation: hit 0.2s ease-out;
        }

        @keyframes hit {
            from { r: 15; opacity: 0; }
            to { r: 4; opacity: 1; }
        }

        #controls {
            margin-top: 30px;
            z-index: 10;
        }

        button {
            background: transparent;
            border: 2px solid white;
            color: white;
            padding: 10px 25px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            font-weight: bold;
        }

        button:hover {
            background: white;
            color: black;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div id="ui-top">
    <div id="score">0</div>
    <div id="info">Kliknij, aby rzucić</div>
</div>

<div id="container">
    <svg id="dartboard" viewBox="-250 -250 500 500"></svg>
</div>

<div id="controls">
    <button onclick="resetGame()">Resetuj wynik</button>
</div>

<script>
    const svg = document.getElementById('dartboard');
    const scoreEl = document.getElementById('score');
    const infoEl = document.getElementById('info');
    let totalScore = 0;

    const SECTORS = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
    const R = { 
        doubleOut: 170, 
        doubleIn: 160, 
        tripleOut: 110, 
        tripleIn: 100, 
        bullOuter: 32, 
        bullInner: 13 
    };

    function polarToCart(r, deg) {
        const rad = (deg - 90) * Math.PI / 180;
        return { x: r * Math.cos(rad), y: r * Math.sin(rad) };
    }

    function createArc(r1, r2, startDeg, endDeg, fill) {
        const s1 = polarToCart(r1, startDeg), e1 = polarToCart(r1, endDeg);
        const s2 = polarToCart(r2, startDeg), e2 = polarToCart(r2, endDeg);
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", `M${s1.x},${s1.y} A${r1},${r1} 0 0 1 ${e1.x},${e1.y} L${e2.x},${e2.y} A${r2},${r2} 0 0 0 ${s2.x},${s2.y} Z`);
        path.setAttribute("fill", fill);
        path.setAttribute("stroke", "#333");
        path.setAttribute("stroke-width", "0.5");
        return path;
    }

    function drawBoard() {
        // Obramowanie czarne
        const bg = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        bg.setAttribute("r", "245"); bg.setAttribute("fill", "black");
        svg.appendChild(bg);

        for (let i = 0; i < 20; i++) {
            const start = i * 18 - 9, end = (i + 1) * 18 - 9;
            const isEven = i % 2 === 0;
            const cSingle = isEven ? "#111" : "#eee";
            const cMulti = isEven ? "#e74c3c" : "#27ae60";

            // Pierścienie
            svg.appendChild(createArc(R.doubleIn, R.doubleOut, start, end, cMulti));
            svg.appendChild(createArc(R.tripleOut, R.doubleIn, start, end, cSingle));
            svg.appendChild(createArc(R.tripleIn, R.tripleOut, start, end, cMulti));
            svg.appendChild(createArc(R.bullOuter, R.tripleIn, start, end, cSingle));

            // Numery
            const textPos = polarToCart(210, i * 18);
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", textPos.x); text.setAttribute("y", textPos.y + 8);
            text.setAttribute("fill", "white"); text.setAttribute("text-anchor", "middle");
            text.setAttribute("font-size", "26"); text.setAttribute("font-weight", "bold");
            text.textContent = SECTORS[i];
            svg.appendChild(text);
        }

        // Bullseye
        const b25 = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        b25.setAttribute("r", R.bullOuter); b25.setAttribute("fill", "#27ae60"); b25.setAttribute("stroke", "#333");
        svg.appendChild(b25);

        const b50 = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        b50.setAttribute("r", R.bullInner); b50.setAttribute("fill", "#e74c3c"); b50.setAttribute("stroke", "#333");
        svg.appendChild(b50);

        // Grupa na rzutki
        const markerGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        markerGroup.id = "marker-layer";
        svg.appendChild(markerGroup);
    }

    function handleInput(e) {
        const rect = svg.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        const x = (clientX - rect.left) * (500 / rect.width) - 250;
        const y = (clientY - rect.top) * (500 / rect.height) - 250;

        const dist = Math.sqrt(x*x + y*y);
        let angle = Math.atan2(y, x) * 180 / Math.PI + 90;
        if (angle < 0) angle += 360;

        let p = 0, label = "Pudło";

        if (dist <= R.bullInner) { p = 50; label = "BULLSEYE!"; }
        else if (dist <= R.bullOuter) { p = 25; label = "Outer Bull"; }
        else if (dist <= R.doubleOut) {
            const secIdx = Math.floor(((angle + 9) % 360) / 18);
            let mult = 1; label = SECTORS[secIdx];
            if (dist >= R.doubleIn) { mult = 2; label = "Double " + SECTORS[secIdx]; }
            else if (dist >= R.tripleIn && dist <= R.tripleOut) { mult = 3; label = "Triple " + SECTORS[secIdx]; }
            p = SECTORS[secIdx] * mult;
        }

        totalScore += p;
        scoreEl.innerText = totalScore;
        infoEl.innerText = label;

        // Dodawanie znacznika
        const m = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        m.setAttribute("cx", x); m.setAttribute("cy", y); m.setAttribute("r", "4");
        m.setAttribute("class", "marker");
        document.getElementById('marker-layer').appendChild(m);
    }

    function resetGame() {
        totalScore = 0;
        scoreEl.innerText = "0";
        infoEl.innerText = "Zaczynamy od nowa!";
        document.getElementById('marker-layer').innerHTML = '';
    }

    svg.addEventListener('mousedown', (e) => handleInput(e));
    svg.addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleInput(e);
    }, {passive: false});

    drawBoard();
</script>
</body>
</html>
