<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dart Pro - Multitouch Fix</title>
    <style>
        :root {
            --bg: #121212;
            --panel-bg: #1e1e1e;
            --accent: #f1c40f;
        }

        body {
            margin: 0; padding: 0; background: var(--bg); color: white;
            font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden;
        }

        #game-wrapper {
            display: flex; flex-direction: row; width: 100%; height: 100%;
            align-items: center; justify-content: space-around; padding: 10px; box-sizing: border-box;
        }

        #sidebar {
            flex: 0 0 220px; background: var(--panel-bg); padding: 25px;
            border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; align-items: center; order: 1;
        }

        #score { font-size: 4rem; font-weight: 900; color: var(--accent); margin: 5px 0; }
        #info { font-size: 1.1rem; color: #aaa; margin-bottom: 20px; text-align: center; height: 2.5em; display: flex; align-items: center; }

        #board-container {
            flex: 1; display: flex; align-items: center; justify-content: center;
            height: 100%; position: relative;
        }

        svg {
            height: 98vh; width: auto; aspect-ratio: 1/1;
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.8));
            touch-action: none;
        }

        .marker { fill: white; stroke: black; stroke-width: 1.5; pointer-events: none; animation: hit 0.15s ease-out; }
        @keyframes hit { from { r: 15; opacity: 0; } to { r: 5; opacity: 1; } }

        button {
            background: #333; border: 1px solid #555; color: white;
            padding: 12px; border-radius: 8px; cursor: pointer;
            transition: 0.2s; font-weight: bold; width: 100%; text-transform: uppercase;
        }

        @media (max-width: 768px) {
            #game-wrapper { flex-direction: column; }
            #sidebar { flex: 0 0 auto; width: 90%; order: 0; padding: 10px; margin-bottom: 5px; }
            #score { font-size: 2.5rem; }
            #board-container { height: 75vh; width: 100%; }
            svg { height: 100%; width: 100%; }
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="sidebar">
        <div style="color: #666; font-size: 0.8rem; letter-spacing: 1px;">TOTAL SCORE</div>
        <div id="score">0</div>
        <div id="info">Szybkie strzały włączone!</div>
        <button onclick="resetGame()">Resetuj Grę</button>
    </div>

    <div id="board-container">
        <svg id="dartboard" viewBox="-250 -250 500 500"></svg>
    </div>
</div>

<script>
    const svg = document.getElementById('dartboard');
    const scoreEl = document.getElementById('score');
    const infoEl = document.getElementById('info');
    let totalScore = 0;

    const SECTORS = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
    const R = { 
        doubleOut: 240, 
        doubleIn: 215,  
        tripleOut: 145, 
        tripleIn: 115,  
        bullOuter: 35,  
        bullInner: 15 
    };

    function polarToCart(r, deg) {
        const rad = (deg - 90) * Math.PI / 180;
        return { x: r * Math.cos(rad), y: r * Math.sin(rad) };
    }

    function createArc(r1, r2, startDeg, endDeg, fill) {
        const s1 = polarToCart(r1, startDeg), e1 = polarToCart(r1, endDeg);
        const s2 = polarToCart(r2, startDeg), e2 = polarToCart(r2, endDeg);
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", `M${s1.x},${s1.y} A${r1},${r1} 0 0 1 ${e1.x},${e1.y} L${e2.x},${e2.y} A${r2},${r2} 0 0 0 ${s2.x},${s2.y} Z`);
        path.setAttribute("fill", fill);
        path.setAttribute("stroke", "#222");
        return path;
    }

    function drawBoard() {
        const bg = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        bg.setAttribute("r", "250"); bg.setAttribute("fill", "black");
        svg.appendChild(bg);

        for (let i = 0; i < 20; i++) {
            const start = i * 18 - 9, end = (i + 1) * 18 - 9;
            const isEven = i % 2 === 0;
            const cSingle = isEven ? "#111" : "#f0f0f0";
            const cMulti = isEven ? "#e74c3c" : "#27ae60";

            svg.appendChild(createArc(R.doubleIn, R.doubleOut, start, end, cMulti));
            svg.appendChild(createArc(R.tripleOut, R.doubleIn, start, end, cSingle));
            svg.appendChild(createArc(R.tripleIn, R.tripleOut, start, end, cMulti));
            svg.appendChild(createArc(R.bullOuter, R.tripleIn, start, end, cSingle));

            const textPos = polarToCart(190, i * 18); 
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", textPos.x); text.setAttribute("y", textPos.y + 6);
            text.setAttribute("fill", isEven ? "white" : "black"); 
            text.setAttribute("text-anchor", "middle");
            text.setAttribute("font-size", "20"); text.setAttribute("font-weight", "bold");
            text.setAttribute("pointer-events", "none");
            text.textContent = SECTORS[i];
            svg.appendChild(text);
        }

        svg.appendChild(createArc(0, R.bullOuter, 0, 360, "#27ae60"));
        const b50 = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        b50.setAttribute("r", R.bullInner); b50.setAttribute("fill", "#e74c3c");
        svg.appendChild(b50);

        const mLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
        mLayer.id = "m-layer";
        svg.appendChild(mLayer);
    }

    // GŁÓWNA FUNKCJA OBLICZAJĄCA (PRZYJMUJE WSPÓŁRZĘDNE)
    function processShot(clientX, clientY) {
        const rect = svg.getBoundingClientRect();
        const scaleX = 500 / rect.width;
        const scaleY = 500 / rect.height;
        const x = (clientX - rect.left) * scaleX - 250;
        const y = (clientY - rect.top) * scaleY - 250;

        const dist = Math.sqrt(x*x + y*y);
        let angle = Math.atan2(y, x) * 180 / Math.PI + 90;
        if (angle < 0) angle += 360;

        let p = 0, label = "Pudło";

        if (dist <= R.bullInner) { p = 50; label = "BULLSEYE!"; }
        else if (dist <= R.bullOuter) { p = 25; label = "Outer Bull"; }
        else if (dist <= R.doubleOut) {
            const secIdx = Math.floor(((angle + 9) % 360) / 18);
            let mult = 1; label = SECTORS[secIdx];
            if (dist >= R.doubleIn) { mult = 2; label = "Double " + SECTORS[secIdx]; }
            else if (dist >= R.tripleIn && dist <= R.tripleOut) { mult = 3; label = "Triple " + SECTORS[secIdx]; }
            p = SECTORS[secIdx] * mult;
        }

        totalScore += p;
        scoreEl.innerText = totalScore;
        infoEl.innerText = label;

        const m = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        m.setAttribute("cx", x); m.setAttribute("cy", y); m.setAttribute("r", "5");
        m.setAttribute("class", "marker");
        document.getElementById('m-layer').appendChild(m);
    }

    // Obsługa myszy (zostawiamy klasycznie)
    svg.addEventListener('mousedown', (e) => {
        processShot(e.clientX, e.clientY);
    });

    // NOWA OBSŁUGA DOTYKU (NAPRAWIA MULTITOUCH)
    svg.addEventListener('touchstart', (e) => {
        e.preventDefault(); // Blokuje scrollowanie i ghost-clicki
        
        // Iterujemy po KAŻDYM nowym dotknięciu palca
        for (let i = 0; i < e.changedTouches.length; i++) {
            const touch = e.changedTouches[i];
            processShot(touch.clientX, touch.clientY);
        }
    }, {passive: false});

    function resetGame() {
        totalScore = 0;
        scoreEl.innerText = "0";
        infoEl.innerText = "Nowa partia!";
        document.getElementById('m-layer').innerHTML = '';
    }

    drawBoard();
</script>
</body>
</html>
