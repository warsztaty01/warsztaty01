<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Street Cross — Canvas Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <div class="controls">
      <label for="lanes">Pasów: <span id="lanesVal">3</span></label>
      <input id="lanes" type="range" min="1" max="4" value="3">
      <button id="startBtn">Start</button>
    </div>
    <div class="score">Punkty: <span id="score">0</span></div>
  </div>

  <div class="game-wrap">
    <canvas id="game"></canvas>
    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <h1 id="overlayTitle">Przegrałeś!</h1>
        <button id="restartBtn">Zacznij jeszcze raz</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
