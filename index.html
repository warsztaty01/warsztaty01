<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dart Pro - Wide Layout</title>
    <style>
        :root {
            --bg: #1a1a1a;
            --panel-bg: #252525;
            --accent: #f1c40f;
            --red: #e74c3c;
            --green: #27ae60;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        /* Główny kontener - na desktopie rzędy, na mobile kolumny */
        #game-wrapper {
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: space-around;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Panel boczny z wynikami */
        #sidebar {
            flex: 0 0 250px;
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            order: 1; /* Wynik po lewej, zmień na 2 jeśli chcesz po prawej */
        }

        #score-label { font-size: 1rem; color: #888; text-transform: uppercase; }
        #score { font-size: 4.5rem; font-weight: 900; color: var(--accent); margin: 0; }
        #info { font-size: 1.2rem; color: #ccc; margin: 15px 0; text-align: center; min-height: 1.5em; }

        /* Kontener tarczy - elastyczny */
        #board-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            max-height: 90vh;
        }

        svg {
            height: 95%; /* Tarcza zajmuje niemal całą wysokość */
            width: auto;
            aspect-ratio: 1/1;
            filter: drop-shadow(0 0 30px rgba(0,0,0,0.7));
        }

        .marker { fill: white; stroke: black; stroke-width: 1; pointer-events: none; animation: hit 0.2s ease-out; }
        @keyframes hit { from { r: 15; opacity: 0; } to { r: 4; opacity: 1; } }

        button {
            background: transparent; border: 2px solid #555; color: white;
            padding: 12px 20px; border-radius: 10px; cursor: pointer;
            transition: all 0.2s; font-weight: bold; width: 100%;
        }
        button:hover { background: white; color: black; border-color: white; }

        /* Adaptacja dla telefonów (układ pionowy) */
        @media (max-width: 768px) {
            #game-wrapper { flex-direction: column; padding: 10px; }
            #sidebar { 
                flex: 0 0 auto; width: 90%; order: 0; 
                padding: 15px; margin-bottom: 10px;
            }
            #score { font-size: 3rem; }
            #board-container { width: 100%; height: 60vh; }
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="sidebar">
        <div id="score-label">Suma punktów</div>
        <div id="score">0</div>
        <div id="info">Celuj w środek!</div>
        <button onclick="resetGame()">Resetuj</button>
    </div>

    <div id="board-container">
        <svg id="dartboard" viewBox="-250 -250 500 500"></svg>
    </div>
</div>

<script>
    const svg = document.getElementById('dartboard');
    const scoreEl = document.getElementById('score');
    const infoEl = document.getElementById('info');
    let totalScore = 0;

    const SECTORS = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
    const R = { doubleOut: 170, doubleIn: 160, tripleOut: 110, tripleIn: 100, bullOuter: 32, bullInner: 13 };

    function polarToCart(r, deg) {
        const rad = (deg - 90) * Math.PI / 180;
        return { x: r * Math.cos(rad), y: r * Math.sin(rad) };
    }

    function createArc(r1, r2, startDeg, endDeg, fill) {
        const s1 = polarToCart(r1, startDeg), e1 = polarToCart(r1, endDeg);
        const s2 = polarToCart(r2, startDeg), e2 = polarToCart(r2, endDeg);
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", `M${s1.x},${s1.y} A${r1},${r1} 0 0 1 ${e1.x},${e1.y} L${e2.x},${e2.y} A${r2},${r2} 0 0 0 ${s2.x},${s2.y} Z`);
        path.setAttribute("fill", fill);
        path.setAttribute("stroke", "#333");
        return path;
    }

    function drawBoard() {
        const bg = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        bg.setAttribute("r", "245"); bg.setAttribute("fill", "black");
        svg.appendChild(bg);

        for (let i = 0; i < 20; i++) {
            const start = i * 18 - 9, end = (i + 1) * 18 - 9;
            const isEven = i % 2 === 0;
            const cSingle = isEven ? "#111" : "#eee";
            const cMulti = isEven ? "#e74c3c" : "#27ae60";

            svg.appendChild(createArc(R.doubleIn, R.doubleOut, start, end, cMulti));
            svg.appendChild(createArc(R.tripleOut, R.doubleIn, start, end, cSingle));
            svg.appendChild(createArc(R.tripleIn, R.tripleOut, start, end, cMulti));
            svg.appendChild(createArc(R.bullOuter, R.tripleIn, start, end, cSingle));

            const textPos = polarToCart(210, i * 18);
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", textPos.x); text.setAttribute("y", textPos.y + 8);
            text.setAttribute("fill", "white"); text.setAttribute("text-anchor", "middle");
            text.setAttribute("font-size", "26"); text.setAttribute("font-weight", "bold");
            text.textContent = SECTORS[i];
            svg.appendChild(text);
        }

        const b25 = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        b25.setAttribute("r", R.bullOuter); b25.setAttribute("fill", "#27ae60");
        svg.appendChild(b25);

        const b50 = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        b50.setAttribute("r", R.bullInner); b50.setAttribute("fill", "#e74c3c");
        svg.appendChild(b50);

        const mLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
        mLayer.id = "m-layer";
        svg.appendChild(mLayer);
    }

    function handleInput(e) {
        const rect = svg.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        const scale = 500 / rect.width;
        const x = (clientX - rect.left) * scale - 250;
        const y = (clientY - rect.top) * (500 / rect.height) - 250;

        const dist = Math.sqrt(x*x + y*y);
        let angle = Math.atan2(y, x) * 180 / Math.PI + 90;
        if (angle < 0) angle += 360;

        let p = 0, label = "Pudło";
        if (dist <= R.bullInner) { p = 50; label = "BULLSEYE!"; }
        else if (dist <= R.bullOuter) { p = 25; label = "Outer Bull"; }
        else if (dist <= R.doubleOut) {
            const secIdx = Math.floor(((angle + 9) % 360) / 18);
            let mult = 1; label = SECTORS[secIdx];
            if (dist >= R.doubleIn) { mult = 2; label = "Double " + SECTORS[secIdx]; }
            else if (dist >= R.tripleIn && dist <= R.tripleOut) { mult = 3; label = "Triple " + SECTORS[secIdx]; }
            p = SECTORS[secIdx] * mult;
        }

        totalScore += p;
        scoreEl.innerText = totalScore;
        infoEl.innerText = label;

        const m = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        m.setAttribute("cx", x); m.setAttribute("cy", y); m.setAttribute("r", "4");
        m.setAttribute("class", "marker");
        document.getElementById('m-layer').appendChild(m);
    }

    function resetGame() {
        totalScore = 0;
        scoreEl.innerText = "0";
        infoEl.innerText = "Celuj w środek!";
        document.getElementById('m-layer').innerHTML = '';
    }

    svg.addEventListener('mousedown', handleInput);
    svg.addEventListener('touchstart', (e) => { e.preventDefault(); handleInput(e); }, {passive: false});

    drawBoard();
</script>
</body>
</html>
