<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dart Pro - Spin Master Fixed v3</title>
    <style>
        :root {
            --bg: #0f1215; --panel: #1c2229; --accent: #00d2ff;
            --p1: #3498db; --p2: #e67e22; --win: #2ecc71;
        }

        body {
            margin: 0; padding: 0; background: var(--bg); color: white;
            font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column;
            height: 100vh; width: 100vw; overflow: hidden; user-select: none;
        }

        header { flex: 0 0 auto; background: var(--panel); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2d3640; z-index: 10; }

        #game-wrapper { flex: 1; display: flex; padding: 10px; gap: 10px; min-height: 0; }
        .side-panel { flex: 0 0 240px; background: var(--panel); padding: 15px; border-radius: 12px; display: flex; flex-direction: column; }

        #board-container { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        #dartboard { max-height: 95%; max-width: 95%; aspect-ratio: 1/1; touch-action: none; cursor: crosshair; }

        .player-card { padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 5px solid transparent; background: #252d37; opacity: 0.5; }
        .player-card.active { opacity: 1; border-left-color: var(--accent); background: #2d3a4a; }
        .score-val { font-size: 2.8rem; font-weight: 900; }
        
        .marker { stroke: white; stroke-width: 1; pointer-events: none; }

        #win-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 18, 21, 0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }

        .btn-group { display: flex; gap: 5px; }
        button { background: #2d3640; border: none; color: white; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button.active-opt { background: var(--accent); color: black; }
        
        #debug-info { position: absolute; bottom: 10px; left: 10px; font-family: monospace; font-size: 10px; color: #555; pointer-events: none; }
    </style>
</head>
<body>

<header>
    <div class="btn-group">
        <button id="mode-classic" class="active-opt" onclick="setGameMode('classic')">Klasyczny</button>
        <button id="mode-battle" onclick="setGameMode('battle')">Bitwa 1vs1</button>
        <button id="btn-spin" style="background:#9b59b6;" onclick="toggleSpin()">SPIN: OFF</button>
    </div>
</header>

<div id="game-wrapper">
    <div class="side-panel">
        <div id="p1-card" class="player-card active">
            <small style="color:var(--p1)">GRACZ 1</small>
            <div id="p1-score" class="score-val">501</div>
        </div>
        <div id="p2-card" class="player-card">
            <small style="color:var(--p2)">GRACZ 2</small>
            <div id="p2-score" class="score-val">501</div>
        </div>
        <div style="text-align:center; padding: 10px; background: #111; border-radius: 5px;">
            RZUTY: <span id="throws-count">0</span> / 3
        </div>
        <button onclick="resetGame()" style="margin-top:10px;">Reset</button>
    </div>

    <div id="board-container">
        <div id="win-overlay">
            <h1 id="winner-name"></h1>
            <button onclick="resetGame()" style="background:var(--win); padding: 15px 30px; border-radius: 10px; color:white; border:none;">ZAGRAJ PONOWNIE</button>
        </div>
        <svg id="dartboard" viewBox="-250 -250 500 500"></svg>
        <div id="debug-info">ROTATION: 0°</div>
    </div>

    <div class="side-panel">
        <strong style="font-size: 0.8rem;">OSTATNIE TRAFIENIE:</strong>
        <div id="last-hit" style="font-size: 2rem; text-align: center; margin-top: 10px; color: var(--accent);">---</div>
        <div id="history-list" style="margin-top:20px; font-size: 0.8rem; overflow-y: auto; flex: 1;"></div>
    </div>
</div>

<script>
    const svg = document.getElementById('dartboard');
    const debug = document.getElementById('debug-info');
    const SECTORS = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
    const R = { doubleOut: 240, doubleIn: 215, tripleOut: 145, tripleIn: 115, bullOuter: 35, bullInner: 15 };

    let game = { 
        isSpinning: false, currentRotation: 0, 
        currentPlayer: 1, scores: { 1: 501, 2: 501 }, 
        throws: 0, mode: 'classic', startScore: 501
    };

    function drawBoard() {
        const createArc = (r1, r2, start, end, fill) => {
            const rad = (d) => (d - 90) * Math.PI / 180;
            const s1 = {x: r1*Math.cos(rad(start)), y: r1*Math.sin(rad(start))}, e1 = {x: r1*Math.cos(rad(end)), y: r1*Math.sin(rad(end))};
            const s2 = {x: r2*Math.cos(rad(start)), y: r2*Math.sin(rad(start))}, e2 = {x: r2*Math.cos(rad(end)), y: r2*Math.sin(rad(end))};
            return `<path d="M${s1.x},${s1.y} A${r1},${r1} 0 0 1 ${e1.x},${e1.y} L${e2.x},${e2.y} A${r2},${r2} 0 0 0 ${s2.x},${s2.y} Z" fill="${fill}" stroke="#222" />`;
        };

        let html = `<circle r="250" fill="black" /> <g id="main-group">`;
        for (let i = 0; i < 20; i++) {
            const start = i * 18 - 9, end = (i + 1) * 18 - 9, isEven = i % 2 === 0;
            html += createArc(R.doubleIn, R.doubleOut, start, end, isEven ? "#e74c3c" : "#27ae60");
            html += createArc(R.tripleOut, R.doubleIn, start, end, isEven ? "#111" : "#eee");
            html += createArc(R.tripleIn, R.tripleOut, start, end, isEven ? "#e74c3c" : "#27ae60");
            html += createArc(R.bullOuter, R.tripleIn, start, end, isEven ? "#111" : "#eee");
            const ang = (i*18)*Math.PI/180;
            html += `<text transform="rotate(${i*18}) translate(0, -190)" fill="${isEven ? 'white' : 'black'}" text-anchor="middle" font-size="20" font-weight="bold">${SECTORS[i]}</text>`;
        }
        html += createArc(0, R.bullOuter, 0, 360, "#27ae60");
        html += `<circle r="${R.bullInner}" fill="#e74c3c" />`;
        html += `<g id="m-layer"></g> </g>`;
        svg.innerHTML = html;
    }

    function animate() {
        if (game.isSpinning) {
            game.currentRotation = (game.currentRotation + 1.2) % 360; 
            document.getElementById('main-group').setAttribute('transform', `rotate(${game.currentRotation}, 0, 0)`);
            debug.innerText = `ROTATION: ${Math.floor(game.currentRotation)}°`;
        }
        requestAnimationFrame(animate);
    }

    function toggleSpin() {
        game.isSpinning = !game.isSpinning;
        document.getElementById('btn-spin').innerText = `SPIN: ${game.isSpinning ? 'ON' : 'OFF'}`;
        if (!game.isSpinning) {
            game.currentRotation = 0;
            document.getElementById('main-group').setAttribute('transform', `rotate(0)`);
        }
    }

    function processShot(clientX, clientY) {
        if (document.getElementById('win-overlay').style.display === 'flex') return;
        
        const rect = svg.getBoundingClientRect();
        const x = (clientX - rect.left) * (500 / rect.width) - 250;
        const y = (clientY - rect.top) * (500 / rect.height) - 250;
        
        const dist = Math.sqrt(x*x + y*y);
        if (dist > 250) return; // Kliknięcie poza tarczą

        // 1. Oblicz kąt wizualny (gdzie kliknęliśmy na ekranie)
        // atan2 zwraca radiany, zamieniamy na stopnie. +90 koryguje start od góry (20).
        let clickAngle = (Math.atan2(y, x) * 180 / Math.PI) + 90;
        if (clickAngle < 0) clickAngle += 360;

        // 2. Odejmij rotację tarczy, aby znaleźć "kąt na tarczy"
        let boardAngle = (clickAngle - game.currentRotation) % 360;
        if (boardAngle < 0) boardAngle += 360;

        // 3. Znajdź sektor (każdy ma 18 stopni, sektor 20 zaczyna się 9 stopni przed zerem)
        const sectorIndex = Math.floor(((boardAngle + 9) % 360) / 18);
        const pointsBase = SECTORS[sectorIndex];

        let multiplier = 1;
        let label = pointsBase.toString();

        if (dist <= R.bullInner) { multiplier = 0; label = "BULL (50)"; game.currentPoints = 50; }
        else if (dist <= R.bullOuter) { multiplier = 0; label = "25"; game.currentPoints = 25; }
        else if (dist > R.doubleOut) { multiplier = 0; label = "0"; game.currentPoints = 0; }
        else if (dist >= R.doubleIn) { multiplier = 2; label = "D" + pointsBase; }
        else if (dist >= R.tripleIn && dist <= R.tripleOut) { multiplier = 3; label = "T" + pointsBase; }
        
        const totalPoints = multiplier === 0 ? game.currentPoints : pointsBase * multiplier;

        // 4. Pozycja markera (musi być w układzie lokalnym tarczy)
        const radLocal = (boardAngle - 90) * Math.PI / 180;
        const lx = dist * Math.cos(radLocal);
        const ly = dist * Math.sin(radLocal);

        placeMarker(lx, ly);
        handleScore(totalPoints, label);
    }

    function placeMarker(lx, ly) {
        const m = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        m.setAttribute("cx", lx); m.setAttribute("cy", ly); m.setAttribute("r", "5");
        m.setAttribute("class", "marker");
        m.setAttribute("fill", game.currentPlayer === 1 ? 'var(--p1)' : 'var(--p2)');
        document.getElementById('m-layer').appendChild(m);
    }

    function handleScore(p, label) {
        game.scores[game.currentPlayer] -= p;
        game.throws++;
        
        document.getElementById('last-hit').innerText = label;
        document.getElementById('p1-score').innerText = game.scores[1];
        document.getElementById('p2-score').innerText = game.scores[2];
        document.getElementById('throws-count').innerText = game.throws;

        if (game.scores[game.currentPlayer] <= 0) {
            showWin(game.currentPlayer);
        } else if (game.throws >= 3) {
            setTimeout(nextTurn, 800);
        }
    }

    function nextTurn() {
        game.throws = 0;
        game.currentPlayer = game.currentPlayer === 1 ? 2 : 1;
        document.getElementById('m-layer').innerHTML = '';
        document.getElementById('throws-count').innerText = "0";
        document.getElementById('p1-card').classList.toggle('active');
        document.getElementById('p2-card').classList.toggle('active');
    }

    function showWin(p) {
        document.getElementById('win-overlay').style.display = 'flex';
        document.getElementById('winner-name').innerText = `GRACZ ${p} WYGRYWA!`;
    }

    function resetGame() {
        game.scores = {1: 501, 2: 501};
        game.throws = 0;
        game.currentPlayer = 1;
        document.getElementById('win-overlay').style.display = 'none';
        document.getElementById('m-layer').innerHTML = '';
        document.getElementById('p1-score').innerText = '501';
        document.getElementById('p2-score').innerText = '501';
        document.getElementById('throws-count').innerText = '0';
    }

    function setGameMode(m) { game.mode = m; resetGame(); }

    svg.addEventListener('mousedown', (e) => processShot(e.clientX, e.clientY));
    drawBoard(); animate();
</script>
</body>
</html>
