<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Brick Breaker — Arkanoid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Brick Breaker</h1>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="hud">
      <div id="score">Punkty: 0</div>
      <div id="lives">Życia: 3</div>
      <div id="level">Poziom: 1</div>
    </div>
    <div class="controls">Sterowanie: mysz / strzałki ← → — naciśnij Spację aby wystartować</div>
    <div class="footer">Edytuj poziomy w <code>js/game.js</code></div>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
