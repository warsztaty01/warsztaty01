<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Koło Fortuny - 5 projektów</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <main>
    <h1>Koło Fortuny — wybierz projekt do zrobienia</h1>

    <section class="wheel-section">
      <canvas id="wheel" width="600" height="600" aria-label="Koło Fortuny" role="img"></canvas>
      <div class="pointer">▼</div>
    </section>

    <div class="controls">
      <button id="spinBtn">Losuj projekt</button>
      <button id="resetBtn">Reset</button>
    </div>

    <section id="result" class="result hidden" aria-live="polite">
      <h2>Wylosowany projekt:</h2>
      <h3 id="resultTitle"></h3>
      <p id="resultDesc"></p>
    </section>

    <section class="projects">
      <h2>Projekty w kole</h2>
      <ol id="projectsList"></ol>
    </section>

    <footer>
      <p>Gotowe do wdrożenia jako Azure Static Web App.</p>
    </footer>
  </main>

  <script src="assets/script.js"></script>
</body>
</html>
