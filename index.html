<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dart Pro - Battle Mode Fixed</title>
    <style>
        :root {
            --bg: #0f1215; --panel: #1c2229; --accent: #00d2ff;
            --p1: #3498db; --p2: #e67e22; --win: #2ecc71;
        }

        body {
            margin: 0; padding: 0; background: var(--bg); color: white;
            font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column;
            height: 100vh; width: 100vw; overflow: hidden; user-select: none;
        }

        header {
            flex: 0 0 auto; background: var(--panel); padding: 10px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 2px solid #2d3640; z-index: 10;
        }

        #game-wrapper { flex: 1; display: flex; padding: 10px; gap: 10px; min-height: 0; }
        .side-panel { flex: 0 0 240px; background: var(--panel); padding: 15px; border-radius: 12px; display: flex; flex-direction: column; }

        #board-container { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; background: radial-gradient(circle, #1a1f25, #000); border-radius: 15px; }
        #dartboard { max-height: 98%; max-width: 98%; aspect-ratio: 1/1; touch-action: none; }

        .player-card { padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 5px solid transparent; background: #252d37; opacity: 0.5; transition: 0.3s; }
        .player-card.active { opacity: 1; border-left-color: var(--accent); background: #2d3a4a; transform: scale(1.02); }
        .score-val { font-size: 2.8rem; font-weight: 900; }
        
        .marker { stroke: white; stroke-width: 1.5; pointer-events: none; }
        
        #win-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 18, 21, 0.95); backdrop-filter: blur(8px);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }

        .btn-group { display: flex; gap: 5px; }
        button { background: #2d3640; border: none; color: white; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button.active-opt { background: var(--accent); color: black; }
        
        #history-list { font-size: 0.85rem; overflow-y: auto; flex: 1; margin-top: 10px; }
        .hist-item { padding: 5px 0; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
        
        .round-info { background: #111; padding: 10px; border-radius: 8px; margin-bottom: 10px; text-align: center; border: 1px solid #333; }
    </style>
</head>
<body>

<header>
    <div class="btn-group">
        <button id="mode-classic" class="active-opt" onclick="setGameMode('classic')">Klasyczny</button>
        <button id="mode-battle" onclick="setGameMode('battle')">Bitwa 1vs1</button>
        <button id="btn-spin" style="background:#9b59b6;" onclick="toggleSpin()">SPIN: OFF</button>
    </div>
    <div id="classic-scores" class="btn-group">
        <button class="score-opt" id="opt-301" onclick="setStartScore(301)">301</button>
        <button class="score-opt active-opt" id="opt-501" onclick="setStartScore(501)">501</button>
    </div>
</header>

<div id="game-wrapper">
    <div class="side-panel">
        <div class="round-info">
            <small style="color: #888;">STATUS GRY</small>
            <div id="round-display" style="font-weight: bold; color: var(--accent);">RUNDA: 1 / 3</div>
        </div>
        <div id="p1-card" class="player-card active">
            <small style="color:var(--p1)">GRACZ 1</small>
            <div id="p1-score" class="score-val">501</div>
        </div>
        <div id="p2-card" class="player-card">
            <small style="color:var(--p2)">GRACZ 2</small>
            <div id="p2-score" class="score-val">501</div>
        </div>
        <div style="text-align:center; padding: 15px; background: #111; border-radius: 8px; margin-top: auto;">
            RZUTY: <span id="throws-count" style="color:var(--accent); font-size: 1.5rem; font-weight: 900;">0</span> / <span id="max-throws">3</span>
        </div>
        <button onclick="resetGame()" style="background:#444; margin-top:10px;">Resetuj Grę</button>
    </div>

    <div id="board-container">
        <div id="win-overlay">
            <div style="text-align:center; background:var(--panel); padding:40px; border-radius:20px; border:2px solid var(--win);">
                <div id="winner-name" style="font-size: 3rem; font-weight: 900;"></div>
                <div id="winner-score-final" style="font-size: 1.5rem; margin-top: 10px; color: #888;"></div>
                <button onclick="resetGame()" style="background:var(--win); padding: 15px 30px; border-radius:10px; color:white; border:none; font-weight:bold; margin-top: 20px;">ZAGRAJ PONOWNIE</button>
            </div>
        </div>
        <svg id="dartboard" viewBox="-250 -250 500 500"></svg>
    </div>

    <div class="side-panel">
        <strong style="font-size: 0.8rem; color: #888; text-transform: uppercase;">Historia rzutów</strong>
        <div id="history-list"></div>
    </div>
</div>

<script>
    const svg = document.getElementById('dartboard');
    const SECTORS = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
    const R = { dOut: 240, dIn: 215, tOut: 145, tIn: 115, bOut: 35, bIn: 15 };

    let game = {
        mode: 'classic', startScore: 501, isSpinning: false, rotation: 0,
        currentPlayer: 1, scores: { 1: 501, 2: 501 }, throws: 0, maxThrows: 3,
        history: [], currentRound: 1, maxRounds: 3
    };

    function drawBoard() {
        const arc = (r1, r2, s, e, f) => {
            const rad = (d) => (d - 90) * Math.PI / 180;
            const p = (r, a) => `${r * Math.cos(rad(a))},${r * Math.sin(rad(a))}`;
            return `<path d="M${p(r1,s)} A${r1},${r1} 0 0 1 ${p(r1,e)} L${p(r2,e)} A${r2},${r2} 0 0 0 ${p(r2,s)} Z" fill="${f}" stroke="#222"/>`;
        };

        let h = `<circle r="250" fill="black"/><g id="wheel-group">`;
        for (let i = 0; i < 20; i++) {
            const s = i * 18 - 9, e = (i + 1) * 18 - 9, ev = i % 2 === 0;
            h += arc(R.dIn, R.dOut, s, e, ev ? "#e74c3c" : "#27ae60");
            h += arc(R.tOut, R.dIn, s, e, ev ? "#111" : "#eee");
            h += arc(R.tIn, R.tOut, s, e, ev ? "#e74c3c" : "#27ae60");
            h += arc(R.bOut, R.tIn, s, e, ev ? "#111" : "#eee");
            const a = (i * 18) * Math.PI / 180;
            h += `<text transform="rotate(${i*18}) translate(0, -195)" fill="${ev?'white':'black'}" text-anchor="middle" font-weight="bold" font-size="20">${SECTORS[i]}</text>`;
        }
        h += `<circle r="${R.bOut}" fill="#27ae60"/><circle r="${R.bIn}" fill="#e74c3c"/>`;
        h += `<g id="dart-layer"></g></g>`;
        svg.innerHTML = h;
    }

    function animate() {
        if (game.isSpinning) {
            game.rotation = (game.rotation + 1.2) % 360;
            document.getElementById('wheel-group').setAttribute('transform', `rotate(${game.rotation})`);
        }
        requestAnimationFrame(animate);
    }

    function toggleSpin() {
        game.isSpinning = !game.isSpinning;
        const btn = document.getElementById('btn-spin');
        btn.innerText = `SPIN: ${game.isSpinning ? 'ON' : 'OFF'}`;
        btn.style.background = game.isSpinning ? '#f39c12' : '#9b59b6';
        if (!game.isSpinning) {
            game.rotation = 0;
            document.getElementById('wheel-group').setAttribute('transform', 'rotate(0)');
        }
    }

    svg.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        const rect = svg.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (500 / rect.width) - 250;
        const y = (e.clientY - rect.top) * (500 / rect.height) - 250;
        const dist = Math.sqrt(x*x + y*y);
        
        if (dist > 250 || document.getElementById('win-overlay').style.display === 'flex') return;

        let clickAngle = (Math.atan2(y, x) * 180 / Math.PI) + 90;
        if (clickAngle < 0) clickAngle += 360;

        let boardAngle = (clickAngle - game.rotation + 360) % 360;
        const secIdx = Math.floor(((boardAngle + 9) % 360) / 18);
        const base = SECTORS[secIdx];

        let pts = 0, label = "0";
        if (dist <= R.bIn) { pts = 50; label = "BULL"; }
        else if (dist <= R.bOut) { pts = 25; label = "25"; }
        else if (dist <= R.dOut) {
            let m = 1; label = base.toString();
            if (dist >= R.dIn) { m = 2; label = "D" + base; }
            else if (dist >= R.tIn && dist <= R.tOut) { m = 3; label = "T" + base; }
            pts = base * m;
        }

        const rad = (boardAngle - 90) * Math.PI / 180;
        const m = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        m.setAttribute("cx", dist * Math.cos(rad)); m.setAttribute("cy", dist * Math.sin(rad));
        m.setAttribute("r", "6"); m.setAttribute("class", "marker");
        m.setAttribute("fill", game.currentPlayer === 1 ? 'var(--p1)' : 'var(--p2)');
        document.getElementById('dart-layer').appendChild(m);

        applyScore(pts, label);
    });

    function applyScore(p, label) {
        const cur = game.scores[game.currentPlayer];
        if (game.mode === 'classic') {
            if (cur - p < 0 || cur - p === 1) { 
                game.throws = 2;
                label = "BUST!"; p = 0;
            } else {
                game.scores[game.currentPlayer] -= p;
            }
        } else {
            game.scores[game.currentPlayer] += p;
        }

        game.history.unshift({ p, label, player: game.currentPlayer, round: game.currentRound });
        game.throws++;
        updateUI();

        if (game.mode === 'classic' && game.scores[game.currentPlayer] === 0) {
            showWin("GRACZ " + game.currentPlayer);
        } else if (game.throws >= game.maxThrows) {
            setTimeout(nextTurn, 800);
        }
    }

    function updateUI() {
        document.getElementById('p1-score').innerText = game.scores[1];
        document.getElementById('p2-score').innerText = game.scores[2];
        document.getElementById('throws-count').innerText = game.throws;
        document.getElementById('max-throws').innerText = game.maxThrows;
        document.getElementById('round-display').innerText = game.mode === 'battle' ? `RUNDA: ${game.currentRound} / ${game.maxRounds}` : "TRYB CIĄGŁY";
        
        const hl = document.getElementById('history-list');
        hl.innerHTML = game.history.map(h => `<div class="hist-item"><span>G${h.player}: ${h.label}</span><b>${h.p}</b></div>`).join('');
    }

    function nextTurn() {
        // Logika zmiany gracza i rundy w trybie bitwy
        if (game.mode === 'battle') {
            if (game.currentPlayer === 2) {
                if (game.currentRound >= game.maxRounds) {
                    const w = game.scores[1] > game.scores[2] ? 1 : (game.scores[2] > game.scores[1] ? 2 : 0);
                    showWin(w === 0 ? "REMIS" : "GRACZ " + w);
                    return;
                }
                game.currentRound++;
            }
        }

        game.throws = 0;
        game.currentPlayer = game.currentPlayer === 1 ? 2 : 1;
        document.getElementById('dart-layer').innerHTML = '';
        document.getElementById('p1-card').classList.toggle('active', game.currentPlayer === 1);
        document.getElementById('p2-card').classList.toggle('active', game.currentPlayer === 2);
        updateUI();
    }

    function setGameMode(m) {
        game.mode = m;
        game.maxThrows = (m === 'battle') ? 5 : 3;
        document.getElementById('mode-classic').classList.toggle('active-opt', m === 'classic');
        document.getElementById('mode-battle').classList.toggle('active-opt', m === 'battle');
        document.getElementById('classic-scores').style.display = (m === 'classic') ? 'flex' : 'none';
        resetGame();
    }

    function setStartScore(v) {
        game.startScore = v;
        document.getElementById('opt-301').classList.toggle('active-opt', v === 301);
        document.getElementById('opt-501').classList.toggle('active-opt', v === 501);
        resetGame();
    }

    function resetGame() {
        game.currentRound = 1;
        game.scores = { 1: (game.mode === 'classic' ? game.startScore : 0), 2: (game.mode === 'classic' ? game.startScore : 0) };
        game.throws = 0; game.currentPlayer = 1; game.history = [];
        document.getElementById('dart-layer').innerHTML = '';
        document.getElementById('win-overlay').style.display = 'none';
        document.getElementById('p1-card').classList.add('active');
        document.getElementById('p2-card').classList.remove('active');
        updateUI();
    }

    function showWin(txt) {
        document.getElementById('win-overlay').style.display = 'flex';
        document.getElementById('winner-name').innerText = txt === "REMIS" ? txt : txt + " WYGRYWA!";
        document.getElementById('winner-score-final').innerText = `WYNIK KOŃCOWY: ${game.scores[1]} - ${game.scores[2]}`;
    }

    drawBoard(); resetGame(); animate();
</script>
</body>
</html>
