<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dart Pro - Spin Master Fixed</title>
    <style>
        :root {
            --bg: #0f1215; --panel: #1c2229; --accent: #00d2ff;
            --p1: #3498db; --p2: #e67e22; --win: #2ecc71;
        }

        body {
            margin: 0; padding: 0; background: var(--bg); color: white;
            font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column;
            height: 100vh; width: 100vw; overflow: hidden;
        }

        header {
            flex: 0 0 auto; background: var(--panel); padding: 10px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 2px solid #2d3640; z-index: 10; gap: 10px;
        }

        #game-wrapper { flex: 1; display: flex; width: 100%; padding: 10px; box-sizing: border-box; gap: 10px; min-height: 0; }
        .side-panel { flex: 0 0 240px; background: var(--panel); padding: 15px; border-radius: 12px; display: flex; flex-direction: column; }

        #board-container { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        
        #dartboard { 
            max-height: 100%; max-width: 100%; aspect-ratio: 1/1; 
            touch-action: none; filter: drop-shadow(0 0 20px rgba(0,0,0,0.5));
        }

        #win-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 18, 21, 0.9); backdrop-filter: blur(8px);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }

        .win-card { background: var(--panel); padding: 40px; border-radius: 20px; text-align: center; border: 2px solid var(--win); animation: popIn 0.5s ease; }
        .win-name { font-size: 3rem; font-weight: 900; margin: 10px 0; }
        
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .player-card { padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 5px solid transparent; background: #252d37; opacity: 0.6; }
        .player-card.active { opacity: 1; border-left-color: var(--accent); background: #2d3a4a; }
        .score-val { font-size: 2.8rem; font-weight: 900; line-height: 1; }
        #history-container { flex: 1; overflow-y: auto; margin-top: 10px; border-top: 1px solid #333; }
        .hist-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #2d3640; font-size: 0.8rem; }
        
        .btn-group { display: flex; gap: 5px; }
        button { background: #2d3640; border: none; color: white; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button.active-opt { background: var(--accent); color: black; }
        .btn-spin { background: #9b59b6; }
        .btn-spin.active-opt { background: #d35400; color: white; }

        .marker { fill: #fff; stroke: #000; stroke-width: 1.5; filter: drop-shadow(0 0 2px rgba(0,0,0,0.8)); }

        @media (max-width: 1000px) { #game-wrapper { flex-direction: column; } .side-panel { flex: none; width: 100%; max-height: 200px; } }
    </style>
</head>
<body>

<header>
    <div class="btn-group">
        <button id="mode-classic" class="active-opt" onclick="setGameMode('classic')">Klasyczny</button>
        <button id="mode-battle" onclick="setGameMode('battle')">Bitwa 1vs1</button>
        <button id="btn-spin" class="btn-spin" onclick="toggleSpin()">TRYB SPIN: OFF</button>
    </div>
    
    <div id="classic-scores" class="btn-group">
        <button class="score-opt" onclick="setStartScore(301)">301</button>
        <button class="score-opt active-opt" onclick="setStartScore(501)">501</button>
    </div>
</header>

<div id="game-wrapper">
    <div class="side-panel">
        <div id="p1-card" class="player-card active">
            <small style="color:var(--p1)">GRACZ 1</small>
            <div id="p1-score" class="score-val">501</div>
        </div>
        <div id="p2-card" class="player-card">
            <small style="color:var(--p2)">GRACZ 2</small>
            <div id="p2-score" class="score-val">501</div>
        </div>
        <div style="text-align:center; padding: 10px; background: #111; border-radius: 5px;">
            RZUTY: <span id="throws-count">0</span> / <span id="max-throws">3</span>
        </div>
        <button onclick="undoLastMove()" style="background:#e74c3c; margin-top:10px;">Cofnij</button>
    </div>

    <div id="board-container">
        <div id="win-overlay">
            <div class="win-card">
                <div id="winner-name" class="win-name">GRACZ 1</div>
                <div id="winner-stats" style="font-size: 1.5rem; color: #888; margin-bottom: 20px;"></div>
                <button onclick="resetGame()" style="background:var(--win); padding: 15px 30px; border-radius: 10px; color: white;">ZAGRAJ PONOWNIE</button>
            </div>
        </div>
        <svg id="dartboard" viewBox="-250 -250 500 500"></svg>
    </div>

    <div class="side-panel">
        <strong style="font-size: 0.8rem; color: #888;">HISTORIA</strong>
        <div id="history-container"><div id="history-list"></div></div>
    </div>
</div>

<script>
    const svg = document.getElementById('dartboard');
    const SECTORS = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
    const R = { doubleOut: 240, doubleIn: 215, tripleOut: 145, tripleIn: 115, bullOuter: 35, bullInner: 15 };

    let game = { 
        mode: 'classic', isSpinning: false, currentRotation: 0, 
        startScore: 501, currentPlayer: 1, scores: { 1: 501, 2: 501 }, 
        throws: 0, maxThrows: 3, currentRound: 1, fullHistory: [] 
    };

    function drawBoard() {
        const createArc = (r1, r2, start, end, fill) => {
            const rad = (d) => (d - 90) * Math.PI / 180;
            const s1 = {x: r1*Math.cos(rad(start)), y: r1*Math.sin(rad(start))}, e1 = {x: r1*Math.cos(rad(end)), y: r1*Math.sin(rad(end))};
            const s2 = {x: r2*Math.cos(rad(start)), y: r2*Math.sin(rad(start))}, e2 = {x: r2*Math.cos(rad(end)), y: r2*Math.sin(rad(end))};
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", `M${s1.x},${s1.y} A${r1},${r1} 0 0 1 ${e1.x},${e1.y} L${e2.x},${e2.y} A${r2},${r2} 0 0 0 ${s2.x},${s2.y} Z`);
            path.setAttribute("fill", fill); path.setAttribute("stroke", "#222"); return path;
        };
        const bg = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        bg.setAttribute("r", "250"); bg.setAttribute("fill", "black"); svg.appendChild(bg);
        
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g"); g.id = "main-group";
        for (let i = 0; i < 20; i++) {
            const start = i * 18 - 9, end = (i + 1) * 18 - 9, isEven = i % 2 === 0;
            g.appendChild(createArc(R.doubleIn, R.doubleOut, start, end, isEven ? "#e74c3c" : "#27ae60"));
            g.appendChild(createArc(R.tripleOut, R.doubleIn, start, end, isEven ? "#111" : "#eee"));
            g.appendChild(createArc(R.tripleIn, R.tripleOut, start, end, isEven ? "#e74c3c" : "#27ae60"));
            g.appendChild(createArc(R.bullOuter, R.tripleIn, start, end, isEven ? "#111" : "#eee"));
            const ang = (i*18-90)*Math.PI/180;
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", 190*Math.cos(ang)); text.setAttribute("y", 190*Math.sin(ang)+7);
            text.setAttribute("fill", isEven ? "white" : "black"); text.setAttribute("text-anchor", "middle");
            text.setAttribute("font-size", "20"); text.setAttribute("font-weight", "bold");
            text.textContent = SECTORS[i]; g.appendChild(text);
        }
        g.appendChild(createArc(0, R.bullOuter, 0, 360, "#27ae60"));
        const b50 = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        b50.setAttribute("r", R.bullInner); b50.setAttribute("fill", "#e74c3c"); g.appendChild(b50);
        
        // WARSTWA RZUTEK WEWNĄTRZ OBROTOWEJ GRUPY
        const ml = document.createElementNS("http://www.w3.org/2000/svg", "g"); ml.id = "m-layer"; 
        g.appendChild(ml);
        
        svg.appendChild(g);
    }

    function animate() {
        if (game.isSpinning) {
            game.currentRotation = (game.currentRotation + 1.2) % 360; 
            document.getElementById('main-group').setAttribute('transform', `rotate(${game.currentRotation})`);
        }
        requestAnimationFrame(animate);
    }

    function toggleSpin() {
        game.isSpinning = !game.isSpinning;
        const btn = document.getElementById('btn-spin');
        btn.innerText = `TRYB SPIN: ${game.isSpinning ? 'ON' : 'OFF'}`;
        btn.classList.toggle('active-opt');
        if (!game.isSpinning) {
            game.currentRotation = 0;
            document.getElementById('main-group').setAttribute('transform', `rotate(0)`);
        }
    }

    function processShot(clientX, clientY) {
        if (document.getElementById('win-overlay').style.display === 'flex') return;
        const rect = svg.getBoundingClientRect();
        const x = (clientX - rect.left) * (500 / rect.width) - 250;
        const y = (clientY - rect.top) * (500 / rect.height) - 250;
        const dist = Math.sqrt(x*x + y*y);
        
        let visualAngle = (Math.atan2(y, x) * 180 / Math.PI + 90 + 360) % 360;
        let correctedAngle = (visualAngle - game.currentRotation + 360) % 360;

        let p = 0, label = "Pudło";
        if (dist <= R.bullInner) { p = 50; label = "BULL"; }
        else if (dist <= R.bullOuter) { p = 25; label = "25"; }
        else if (dist <= R.doubleOut) {
            const secIdx = Math.floor(((correctedAngle + 9) % 360) / 18);
            let mult = 1; label = SECTORS[secIdx];
            if (dist >= R.doubleIn) { mult = 2; label = "D" + SECTORS[secIdx]; }
            else if (dist >= R.tripleIn && dist <= R.tripleOut) { mult = 3; label = "T" + SECTORS[secIdx]; }
            p = SECTORS[secIdx] * mult;
        }

        // OBLICZANIE LOKALNYCH WSPÓŁRZĘDNYCH DLA MARKERA (by obracał się z tarczą)
        const rad = (-game.currentRotation) * Math.PI / 180;
        const localX = x * Math.cos(rad) - y * Math.sin(rad);
        const localY = x * Math.sin(rad) + y * Math.cos(rad);
        
        handleLogic(p, label, localX, localY);
    }

    function handleLogic(p, label, lx, ly) {
        const isBust = (game.mode === 'classic' && (game.scores[game.currentPlayer] - p < 0 || game.scores[game.currentPlayer] - p === 1));
        game.fullHistory.push({ player: game.currentPlayer, points: p, label, lx, ly, isBust, round: game.currentRound });

        if (game.mode === 'classic') {
            if (!isBust) {
                game.scores[game.currentPlayer] -= p;
                if (game.scores[game.currentPlayer] === 0) return showWin(game.currentPlayer);
            } else { game.throws = 2; }
        } else { game.scores[game.currentPlayer] += p; }

        game.throws++;
        updateUI();
        if (game.throws >= game.maxThrows) setTimeout(nextTurn, 600);
    }

    function showWin(player) {
        document.getElementById('win-overlay').style.display = 'flex';
        document.getElementById('winner-name').innerText = player === 0 ? "REMIS" : `GRACZ ${player}`;
        document.getElementById('winner-stats').innerText = `${game.scores[1]} - ${game.scores[2]}`;
    }

    function nextTurn() {
        if (game.mode === 'battle' && game.currentPlayer === 2) {
            if (game.currentRound >= 3) {
                const w = game.scores[1] > game.scores[2] ? 1 : (game.scores[2] > game.scores[1] ? 2 : 0);
                return showWin(w);
            }
            game.currentRound++;
        }
        game.throws = 0; game.currentPlayer = game.currentPlayer === 1 ? 2 : 1;
        updateUI();
    }

    function updateUI() {
        document.getElementById('p1-score').innerText = game.scores[1];
        document.getElementById('p2-score').innerText = game.scores[2];
        document.getElementById('throws-count').innerText = game.throws;
        document.getElementById('max-throws').innerText = game.maxThrows;
        document.getElementById('p1-card').className = 'player-card' + (game.currentPlayer === 1 ? ' active' : '');
        document.getElementById('p2-card').className = 'player-card' + (game.currentPlayer === 2 ? ' active' : '');
        
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        [...game.fullHistory].reverse().forEach(s => {
            const row = document.createElement('div');
            row.className = 'hist-row';
            row.innerHTML = `<span>G${s.player} (R${s.round}): ${s.label}</span><span>${game.mode === 'classic' ? '-' : '+'}${s.points}</span>`;
            list.appendChild(row);
        });

        const mLayer = document.getElementById('m-layer');
        mLayer.innerHTML = '';
        // Pokazujemy tylko rzutki z obecnej tury
        game.fullHistory.filter(h => h.player === game.currentPlayer && h.round === game.currentRound).forEach(s => {
            const m = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            m.setAttribute("cx", s.lx); m.setAttribute("cy", s.ly); m.setAttribute("r", "5");
            m.setAttribute("class", "marker"); mLayer.appendChild(m);
        });
    }

    function undoLastMove() {
        if (game.fullHistory.length === 0) return;
        const last = game.fullHistory.pop();
        if (last.player !== game.currentPlayer) { game.currentPlayer = last.player; game.currentRound = last.round; }
        if (game.mode === 'classic') { if (!last.isBust) game.scores[last.player] += last.points; }
        else { game.scores[last.player] -= last.points; }
        game.throws--; if (game.throws < 0) game.throws = game.maxThrows - 1;
        updateUI();
    }

    function setGameMode(mode) {
        game.mode = mode;
        document.getElementById('mode-classic').classList.toggle('active-opt', mode === 'classic');
        document.getElementById('mode-battle').classList.toggle('active-opt', mode === 'battle');
        document.getElementById('classic-scores').style.display = mode === 'classic' ? 'flex' : 'none';
        resetGame();
    }

    function setStartScore(val) { game.startScore = val; resetGame(); }

    function resetGame() {
        document.getElementById('win-overlay').style.display = 'none';
        game.currentPlayer = 1; game.throws = 0; game.currentRound = 1; game.fullHistory = [];
        if (game.mode === 'classic') { game.scores = { 1: game.startScore, 2: game.startScore }; game.maxThrows = 3; }
        else { game.scores = { 1: 0, 2: 0 }; game.maxThrows = 5; }
        updateUI();
    }

    svg.addEventListener('mousedown', (e) => processShot(e.clientX, e.clientY));
    drawBoard(); resetGame(); animate();
</script>
</body>
</html>
