<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dart Pro - Fixed Layout</title>
    <style>
        :root {
            --bg: #0f1215; --panel: #1c2229; --accent: #00d2ff;
            --p1: #3498db; --p2: #e67e22;
        }

        body {
            margin: 0; padding: 0; background: var(--bg); color: white;
            font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column;
            height: 100vh; width: 100vw; overflow: hidden; /* Blokada przesuwania całej strony */
        }

        header {
            flex: 0 0 auto; /* Nagłówek ma stałą wysokość */
            background: var(--panel); padding: 10px 20px; display: flex; 
            justify-content: space-between; align-items: center; border-bottom: 2px solid #2d3640;
        }

        #game-wrapper {
            flex: 1; /* Zajmuje całą resztę miejsca między headerem a dołem */
            display: flex; width: 100%; padding: 10px; box-sizing: border-box; gap: 10px;
            min-height: 0; /* Kluczowe dla Flexbox, by dzieci mogły się przewijać */
        }

        .side-panel {
            flex: 0 0 240px; background: var(--panel); padding: 15px;
            border-radius: 12px; display: flex; flex-direction: column;
            max-height: 100%; /* Nie może urosnąć bardziej niż wrapper */
            box-sizing: border-box;
        }

        #board-container {
            flex: 1; display: flex; align-items: center; justify-content: center;
            min-width: 0; overflow: hidden;
        }

        svg {
            max-height: 100%; max-width: 100%; aspect-ratio: 1/1;
            touch-action: none; filter: drop-shadow(0 0 20px rgba(0,0,0,0.5));
        }

        /* --- STYLIZACJA HISTORII (NAPRAWA) --- */
        #history-container {
            flex: 1; 
            overflow-y: auto; /* Przewijanie tylko wewnątrz listy */
            margin-top: 10px;
            padding-right: 5px;
            border-top: 1px solid #333;
        }

        /* Stylizacja scrollbara dla nowoczesnego wyglądu */
        #history-container::-webkit-scrollbar { width: 5px; }
        #history-container::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }

        .hist-row {
            display: flex; justify-content: space-between; padding: 8px 0;
            border-bottom: 1px solid #2d3640; font-size: 0.85rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* Reszta styli bez zmian */
        .player-card { padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 5px solid transparent; background: #252d37; opacity: 0.6; }
        .player-card.active { opacity: 1; border-left-color: var(--accent); background: #2d3a4a; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .score-val { font-size: 2.8rem; font-weight: 900; line-height: 1; }
        .btn-group { display: flex; gap: 5px; }
        button { background: #2d3640; border: none; color: white; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button.active-opt { background: var(--accent); color: black; }
        #undo-btn { background: #e74c3c; width: 100%; margin-top: 10px; }
        .marker { fill: white; stroke: black; stroke-width: 1.5; pointer-events: none; }

        @media (max-width: 1000px) {
            #game-wrapper { flex-direction: column; overflow-y: auto; }
            .side-panel { flex: none; width: 100%; max-height: 300px; }
            #board-container { height: 60vh; flex: none; }
        }
    </style>
</head>
<body>

<header>
    <div class="btn-group">
        <button class="score-opt" onclick="setStartScore(301)">301</button>
        <button class="score-opt" onclick="setStartScore(401)">401</button>
        <button class="score-opt active-opt" onclick="setStartScore(501)">501</button>
    </div>
    <div id="hint-text" style="color: var(--accent); font-weight: bold; font-size: 1.2rem;">T20 - T20 - T20</div>
</header>

<div id="game-wrapper">
    <div class="side-panel">
        <div id="p1-card" class="player-card active">
            <small style="color:var(--p1); font-weight: bold;">GRACZ 1</small>
            <div id="p1-score" class="score-val">501</div>
        </div>
        <div id="p2-card" class="player-card">
            <small style="color:var(--p2); font-weight: bold;">GRACZ 2</small>
            <div id="p2-score" class="score-val">501</div>
        </div>
        <div style="text-align:center; margin: 10px 0; background: #111; padding: 5px; border-radius: 5px;">
            RZUTY: <span id="throws-count" style="color:var(--accent); font-weight: bold;">0</span> / 3
        </div>
        <button id="undo-btn" onclick="undoLastMove()">Cofnij ruch</button>
        <button onclick="resetGame()" style="margin-top:5px; background: #444; font-size: 0.8rem;">Restart</button>
    </div>

    <div id="board-container">
        <svg id="dartboard" viewBox="-250 -250 500 500"></svg>
    </div>

    <div class="side-panel">
        <strong style="font-size: 0.8rem; letter-spacing: 1px; color: #888;">HISTORIA MECZU</strong>
        <div id="history-container">
            <div id="history-list"></div>
        </div>
    </div>
</div>

<script>
    // Logika skryptu pozostaje ta sama co wcześniej, z drobnymi poprawkami UI
    const svg = document.getElementById('dartboard');
    const SECTORS = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
    const R = { doubleOut: 240, doubleIn: 215, tripleOut: 145, tripleIn: 115, bullOuter: 35, bullInner: 15 };

    let startScore = 501;
    let game = { currentPlayer: 1, scores: { 1: 501, 2: 501 }, throws: 0, fullHistory: [] };

    const CHECKOUTS = { 170: "T20-T20-BULL", 167: "T20-T19-BULL", 164: "T20-T18-BULL", 161: "T20-T17-BULL", 160: "T20-T20-D20", 40: "D20", 32: "D16", 16: "D8", 8: "D4", 4: "D2", 2: "D1" };

    function drawBoard() {
        const bg = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        bg.setAttribute("r", "250"); bg.setAttribute("fill", "black");
        svg.appendChild(bg);

        const createArc = (r1, r2, start, end, fill) => {
            const rad = (d) => (d - 90) * Math.PI / 180;
            const s1 = {x: r1*Math.cos(rad(start)), y: r1*Math.sin(rad(start))}, e1 = {x: r1*Math.cos(rad(end)), y: r1*Math.sin(rad(end))};
            const s2 = {x: r2*Math.cos(rad(start)), y: r2*Math.sin(rad(start))}, e2 = {x: r2*Math.cos(rad(end)), y: r2*Math.sin(rad(end))};
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", `M${s1.x},${s1.y} A${r1},${r1} 0 0 1 ${e1.x},${e1.y} L${e2.x},${e2.y} A${r2},${r2} 0 0 0 ${s2.x},${s2.y} Z`);
            path.setAttribute("fill", fill); path.setAttribute("stroke", "#222");
            return path;
        };

        for (let i = 0; i < 20; i++) {
            const start = i * 18 - 9, end = (i + 1) * 18 - 9;
            const isEven = i % 2 === 0;
            svg.appendChild(createArc(R.doubleIn, R.doubleOut, start, end, isEven ? "#e74c3c" : "#27ae60"));
            svg.appendChild(createArc(R.tripleOut, R.doubleIn, start, end, isEven ? "#111" : "#eee"));
            svg.appendChild(createArc(R.tripleIn, R.tripleOut, start, end, isEven ? "#e74c3c" : "#27ae60"));
            svg.appendChild(createArc(R.bullOuter, R.tripleIn, start, end, isEven ? "#111" : "#eee"));

            const ang = (i*18-90)*Math.PI/180;
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", 190*Math.cos(ang)); text.setAttribute("y", 190*Math.sin(ang)+7);
            text.setAttribute("fill", isEven ? "white" : "black"); text.setAttribute("text-anchor", "middle");
            text.setAttribute("font-size", "20"); text.setAttribute("font-weight", "bold");
            text.textContent = SECTORS[i]; svg.appendChild(text);
        }
        svg.appendChild(createArc(0, R.bullOuter, 0, 360, "#27ae60"));
        const b50 = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        b50.setAttribute("r", R.bullInner); b50.setAttribute("fill", "#e74c3c"); svg.appendChild(b50);
        const mLayer = document.createElementNS("http://www.w3.org/2000/svg", "g"); mLayer.id = "m-layer"; svg.appendChild(mLayer);
    }

    function processShot(clientX, clientY) {
        const rect = svg.getBoundingClientRect();
        const x = (clientX - rect.left) * (500 / rect.width) - 250;
        const y = (clientY - rect.top) * (500 / rect.height) - 250;
        const dist = Math.sqrt(x*x + y*y);
        let angle = (Math.atan2(y, x) * 180 / Math.PI + 90 + 360) % 360;

        let p = 0, label = "Pudło";
        if (dist <= R.bullInner) { p = 50; label = "BULL"; }
        else if (dist <= R.bullOuter) { p = 25; label = "25"; }
        else if (dist <= R.doubleOut) {
            const secIdx = Math.floor(((angle + 9) % 360) / 18);
            let mult = 1; label = SECTORS[secIdx];
            if (dist >= R.doubleIn) { mult = 2; label = "D" + SECTORS[secIdx]; }
            else if (dist >= R.tripleIn && dist <= R.tripleOut) { mult = 3; label = "T" + SECTORS[secIdx]; }
            p = SECTORS[secIdx] * mult;
        }

        const isBust = (game.scores[game.currentPlayer] - p < 0 || game.scores[game.currentPlayer] - p === 1);
        
        game.fullHistory.push({ 
            player: game.currentPlayer, points: p, label: label, 
            x: x, y: y, isBust: isBust, prevThrows: game.throws 
        });

        if (!isBust) {
            game.scores[game.currentPlayer] -= p;
            if (game.scores[game.currentPlayer] === 0) { alert(`GRACZ ${game.currentPlayer} WYGRAŁ!`); resetGame(); return; }
        } else {
            alert("BUST!");
            game.throws = 2; 
        }

        game.throws++;
        refreshUI();
        if (game.throws >= 3) setTimeout(nextTurn, 800);
    }

    function undoLastMove() {
        if (game.fullHistory.length === 0) return;
        const last = game.fullHistory.pop();
        if (last.player !== game.currentPlayer) {
            game.currentPlayer = last.player;
            document.getElementById('p1-card').classList.toggle('active');
            document.getElementById('p2-card').classList.toggle('active');
        }
        if (!last.isBust) game.scores[last.player] += last.points;
        game.throws = last.prevThrows;
        
        // Czyścimy markery i listę historii w UI i generujemy je od nowa
        document.getElementById('m-layer').innerHTML = '';
        document.getElementById('history-list').innerHTML = '';
        
        // Odtwarzamy rzuty w tarczy dla obecnej tury
        game.fullHistory.slice(-game.throws).forEach(shot => {
             const m = document.createElementNS("http://www.w3.org/2000/svg", "circle");
             m.setAttribute("cx", shot.x); m.setAttribute("cy", shot.y); m.setAttribute("r", "5");
             m.setAttribute("class", "marker"); document.getElementById('m-layer').appendChild(m);
        });

        // Odtwarzamy listę historii
        const tempHistory = [...game.fullHistory].reverse();
        tempHistory.forEach(shot => {
            const row = document.createElement('div');
            row.className = 'hist-row';
            row.innerHTML = `<span>G${shot.player}: ${shot.label}</span><span>-${shot.points}</span>`;
            document.getElementById('history-list').appendChild(row);
        });

        refreshUI(true);
    }

    function refreshUI(isUndo = false) {
        document.getElementById('p1-score').innerText = game.scores[1];
        document.getElementById('p2-score').innerText = game.scores[2];
        document.getElementById('throws-count').innerText = game.throws;
        
        if (!isUndo && game.fullHistory.length > 0) {
            const last = game.fullHistory[game.fullHistory.length-1];
            const histRow = document.createElement('div');
            histRow.className = 'hist-row';
            histRow.innerHTML = `<span>G${last.player}: ${last.label}</span><span>-${last.points}</span>`;
            document.getElementById('history-list').prepend(histRow);

            const m = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            m.setAttribute("cx", last.x); m.setAttribute("cy", last.y); m.setAttribute("r", "5");
            m.setAttribute("class", "marker"); document.getElementById('m-layer').appendChild(m);
        }

        const s = game.scores[game.currentPlayer];
        const h = document.getElementById('hint-text');
        if (s > 170) h.innerText = "Celuj w T20";
        else h.innerText = CHECKOUTS[s] || (s <= 40 && s % 2 === 0 ? "D"+(s/2) : "Zostaw D20/D16");
    }

    function nextTurn() {
        game.throws = 0;
        game.currentPlayer = game.currentPlayer === 1 ? 2 : 1;
        document.getElementById('p1-card').classList.toggle('active');
        document.getElementById('p2-card').classList.toggle('active');
        document.getElementById('m-layer').innerHTML = '';
        refreshUI(true);
    }

    function setStartScore(val) {
        startScore = val;
        document.querySelectorAll('.score-opt').forEach(b => b.classList.remove('active-opt'));
        event.currentTarget.classList.add('active-opt');
        resetGame();
    }

    function resetGame() {
        game.scores = { 1: startScore, 2: startScore };
        game.throws = 0; game.currentPlayer = 1; game.fullHistory = [];
        document.getElementById('history-list').innerHTML = '';
        document.getElementById('m-layer').innerHTML = '';
        document.getElementById('p1-card').classList.add('active');
        document.getElementById('p2-card').classList.remove('active');
        refreshUI(true);
    }

    svg.addEventListener('mousedown', (e) => processShot(e.clientX, e.clientY));
    svg.addEventListener('touchstart', (e) => {
        e.preventDefault();
        for (let t of e.changedTouches) processShot(t.clientX, t.clientY);
    }, {passive: false});

    drawBoard(); refreshUI(true);
</script>
</body>
</html>
